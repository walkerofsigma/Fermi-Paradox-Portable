name: Build Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install

      - name: Compilar App (.exe)
        run: npm run build

      - name: Guardar o Executável (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: Fermi-Paradox-Windows
          path: dist/
